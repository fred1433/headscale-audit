[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headscale-audit"
version = "0.1.0"
description = "Read-only configuration and policy audit for a self-hosted Headscale control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frederic de Lavenne de Choulot", email = "frederic@theaipipe.com" }]
keywords = ["headscale", "tailscale", "audit", "wireguard", "vpn", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
headscale-audit = "headscale_audit.cli:main"

[project.urls]
Homepage = "https://github.com/fred1433/headscale-audit"
Source = "https://github.com/fred1433/headscale-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports headscale_audit from src/, so it runs whether or not the
# package has been installed into the environment.
pythonpath = ["src"]
